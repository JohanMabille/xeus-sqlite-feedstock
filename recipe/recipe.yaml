context:
  version: "0.11.0"
  build_number: 0

package:
  name: xeus-sqlite
  version: ${{ version }}

source:
  url: https://github.com/jupyter-xeus/xeus-sqlite/archive/${{ version }}.tar.gz
  sha256: 230a0aef9a3fc6962b43af650b192c36c1f9b6147be95a631957e8bb61e11041

build:
  number: ${{ build_number }}
  skip:
    - win

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
  host:
    - xeus-zmq >=4.0.0,<5.0.0
    - nlohmann_json
    - nlohmann_json-abi
    - xtl
    # cpp-tabulate 1.5 is backward incompatible
    - cpp-tabulate >=1.5
    - sqlitecpp
    - sqlite
    - xvega >=0.2.0,<0.3.0
    - xvega-bindings >=0.2.0,<0.3
    - xproperty >=0.13.1,<0.14
  run:
    - ${{ pin_compatible('xvega', upper_bound='x.x') }}
    - ${{ pin_compatible('xvega-bindings', upper_bound='x.x') }}

tests:
  - package_contents:
      bin:
        - xsqlite
      lib:
        - xeus-sqlite
      include:
        - xeus-sqlite/xeus_sqlite_config.hpp
        - xeus-sqlite/xeus_sqlite_interpreter.hpp
      files:
        - ${{ "Library/" if win }}share/jupyter/kernels/xsqlite/kernel.json

about:
  homepage: https://github.com/jupyter-xeus/xeus-sqlite
  repository: https://github.com/jupyter-xeus/xeus-sqlite
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Jupyter kernel for SQLite based on xeus
  documentation: https://xeus-sqlite.readthedocs.io

extra:
  recipe-maintainers:
    - SylvainCorlay
    - JohanMabille
    - martinRenou
    - jtpio
    - marimeireles
